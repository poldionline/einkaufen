<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkaufsliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4EC; --surface:#FFFFFF; --ink:#14281F; --muted:#5E7468;
  --green:#1F5C45; --green-soft:#D5EBDC; --tomato:#E8503A; --sun:#F6C945; --line:#CFE2D5;
  --hero-a:#1F5C45; --hero-b:#2F7A5C; --hero-ink:#F4FBF6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A14; --surface:#16271E; --ink:#E6F2EA; --muted:#8FA89A;
    --green:#5CC49A; --green-soft:#21402F; --tomato:#FF7560; --sun:#F6C945; --line:#244034;
    --hero-a:#1B4A38; --hero-b:#256B50; --hero-ink:#F4FBF6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A14; --surface:#16271E; --ink:#E6F2EA; --muted:#8FA89A;
  --green:#5CC49A; --green-soft:#21402F; --tomato:#FF7560; --sun:#F6C945; --line:#244034;
  --hero-a:#1B4A38; --hero-b:#256B50; --hero-ink:#F4FBF6; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);padding:22px 22px 0;min-height:290px}
.hero h1{margin:0;font-size:2.2rem;line-height:1.05;font-weight:800;letter-spacing:-.02em;max-width:60%}
.hero p{margin:8px 0 0;max-width:46%;opacity:.85;font-size:.98rem}
.art{position:absolute;right:-6px;bottom:44px;width:54%;max-width:280px}
.ring{position:absolute;left:22px;bottom:50px;width:84px;height:84px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{stroke:rgba(255,255,255,.2)}
.ring .p{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,1.2,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem;font-weight:800}
.theme{position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.16);color:var(--hero-ink);width:38px;height:38px;border-radius:50%;font-size:1.05rem;cursor:pointer;z-index:2}
.add{margin:-26px 12px 0;position:relative;z-index:3;background:var(--surface);border-radius:22px;padding:12px;box-shadow:0 10px 30px rgba(20,40,31,.16);display:grid;grid-template-columns:1fr 64px;gap:8px}
.add input,.add select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;min-width:0;width:100%}
.add input:focus,.add select:focus{outline:none;border-color:var(--green)}
.add .row2{grid-column:1/-1}
.add select{transition:background .3s}
.add select.auto{background:var(--green-soft)}
.add .qty{text-align:center;padding-inline:6px}
.add button{grid-column:1/-1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;font-size:1rem;color:#fff;background:var(--tomato);cursor:pointer;transition:transform .12s}
.add button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.group{margin-top:22px}
.group h2{display:flex;align-items:center;gap:10px;margin:0 4px 10px;font-size:1.15rem;font-weight:700}
.group h2 .ico{width:36px;height:36px;border-radius:12px;background:var(--green-soft);display:grid;place-items:center;font-size:1.2rem}
.group h2 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:.85rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 12px;border:1px solid var(--line);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.chk{flex:none;width:28px;height:28px;border-radius:10px;border:2.5px solid var(--green);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .2s}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s .05s}
li.done .chk{background:var(--green)}
li.done .chk svg{stroke-dashoffset:0;stroke:var(--surface)}
.name{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .2s}
li.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--tomato)}
.q{flex:none;background:var(--sun);color:#3a2d00;border-radius:999px;padding:2px 11px;font-weight:700;font-size:.85rem}
li.done .q{opacity:.45}
.del{flex:none;border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:1.2rem;cursor:pointer}
.del:hover{color:var(--tomato);background:var(--bg)}
.empty{margin-top:28px;text-align:center;color:var(--muted);padding:26px 18px;border:2px dashed var(--line);border-radius:22px}
.empty svg{width:90px;margin-bottom:8px}
.clear{display:block;margin:26px auto 0;border:2px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer}
.clear:hover{border-color:var(--tomato);color:var(--tomato)}
[hidden]{display:none!important}
@media (max-width:420px){.hero h1{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div class="add">

    <div class="row2"><select id="cat" aria-label="Kategorie"></select></div>
    <button id="addBtn" type="button">Zum Korb hinzufügen</button>
  </div>

  <main id="list"></main>
  <div class="empty" id="empty">
    <svg viewBox="0 0 90 70" aria-hidden="true"><path d="M10 28H80L72 62Q71 66 66 66H24Q19 66 18 62Z" fill="var(--green-soft)"/><path d="M10 28H80" stroke="var(--green)" stroke-width="5" stroke-linecap="round"/><path d="M28 28 L38 8 M62 28 L52 8" stroke="var(--green)" stroke-width="4" stroke-linecap="round"/></svg>
    <div>Dein Korb ist leer. Tippe oben einen Artikel ein, um zu starten.</div>
  </div>
  <button class="clear" id="clear" hidden>Erledigte entfernen</button>
</div>

<script>
const CATS=[["🥕","Obst & Gemüse"],["🥖","Brot & Backwaren"],["🥛","Milch & Eier"],["🐟","Fleisch & Fisch"],["🥤","Getränke"],["🛒","Sonstiges"]];
const KEY="einkaufsliste-v1";
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}
if(!Array.isArray(items))items=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
$("cat").innerHTML=CATS.map((c,i)=>`<option value="${i}">${c[0]}  ${c[1].replace("&","&amp;")}</option>`).join("");

const KW={4:['wasser','saft','cola','limo','bier','wein','sekt','tee','kaffee','sprudel','schorle','getränk','fanta','sprite','drink','spezi','prosecco','cidre'],3:['fleisch','hack','hähnchen','huhn','pute','wurst','schinken','salami','speck','steak','schnitzel','lachs','fisch','thunfisch','garnele','forelle','rind','schwein'],2:['milch','käse','joghurt','butter','ei','eier','sahne','quark','skyr','margarine','mozzarella','parmesan','schmand','kefir'],1:['brot','brötchen','semmel','toast','brezel','croissant','kuchen','baguette','gebäck','mehl','hefe','knäcke'],0:['apfel','äpfel','birne','banane','orange','zitrone','tomate','gurke','paprika','salat','karotte','möhre','zwiebel','knoblauch','kartoffel','brokkoli','spinat','pilz','champignon','beere','traube','avocado','zucchini','lauch','kohl','obst','gemüse','mango','ingwer','kürbis','radieschen','melone','pfirsich','kiwi','ananas','basilikum','petersilie','karotten']};
const MORE={
0:['clementine','mandarine','grapefruit','pampelmuse','limette','nektarine','pflaume','zwetschge','kirsche','himbeere','heidelbeere','blaubeere','brombeere','johannisbeere','stachelbeere','cranberr','granatapfel','feige','dattel','papaya','litschi','maracuja','passionsfrucht','kaki','rhabarber','quitte','aprikose','marille','honigmelone','kokosnuss','aubergine','kohlrabi','blumenkohl','rosenkohl','rotkohl','weißkohl','weisskohl','wirsing','chinakohl','grünkohl','spargel','fenchel','sellerie','pastinake','petersilienwurzel','rote bete','rübe','steckrübe','süßkartoffel','maiskolben','erbse','bohne','pak choi','mangold','rucola','feldsalat','eisberg','romana','endivie','radicchio','chicorée','kresse','schnittlauch','dill','koriander','minze','thymian','rosmarin','salbei','oregano','majoran','bärlauch','lauchzwiebel','frühlingszwiebel','schalotte','chili','peperoni','jalape','meerrettich','rettich','mohrrübe','drilling','pfifferling','steinpilz','austernpilz','kräuterseitling','shiitake','cherrytomate','strauchtomate','cocktailtomate','snackgurke','salatgurke','artischocke','sprossen','keimling','kräuter','gemüse','salatherz','suppengrün','suppengemüse','zuckerschote','kaiserschote','physalis','sternfrucht','guave','zuckermelone','kumquat','mirabelle','holunder','ananas','rispentomate'],

2:['vollmilch','frischmilch','h-milch','kondensmilch','gouda','edamer','emmentaler','cheddar','camembert','brie','feta','hirtenkäse','halloumi','ricotta','mascarpone','gorgonzola','bergkäse','tilsiter','schnittkäse','reibekäse','scheibenkäse','streukäse','pecorino','grana','provolone','harzer','handkäse','ziegenkäse','schafskäse','raclette','fondue','hüttenkäse','frischkäse','philadelphia','buko','kräuterquark','speisequark','magerquark','naturjoghurt','joghurt','dickmilch','sauerrahm','creme fraiche','crème','fraiche','fraîche','schlagsahne','schmand','pudding','dessert','eiweiß','eigelb','eierlikör','tofu','tempeh','seitan','burrata','obazda','ayran','lassi','kefir','skyr','butterschmalz','mozzarella','parmesan','oatly','sojajoghurt','quark','gruyère','gruyere','appenzeller','manchego','leerdamer','maasdam','limburger','romadur','tête de moine','cremefine','rama','becel','almette','exquisa','bärenmarke','müllermilch','paula','zott','grießbrei','rahm','molke','buttermilch','trinkjoghurt','eier','freilandei','bodenhaltung'],
3:['rinderhack','gehacktes','hackepeter','mett','rindersteak','entrecote','schweinefilet','kotelett','nacken','schweinebauch','rippchen','spareribs','braten','gulasch','geschnetzeltes','roulade','leber','leberwurst','blutwurst','mettwurst','fleischwurst','lyoner','mortadella','kochschinken','rohschinken','parmaschinken','serrano','prosciutto','bacon','frühstücksspeck','würstchen','wiener','bockwurst','bratwurst','currywurst','knacker','chorizo','pastrami','=lamm','hammel','kalb','=wild','=reh','=hirsch','=ente','=gans','truthahn','puten','hähnchen','keule','flügel','nuggets','patty','frikadelle','bulette','hackbällchen','fischfilet','seelachs','kabeljau','dorade','makrele','hering','matjes','sardine','sardelle','scholle','zander','barsch','karpfen','=wels','=aal','garnele','shrimp','scampi','krabbe','hummer','muschel','tintenfisch','calamari','räucherlachs','fischstäbchen','surimi','rollmops','filet','suppenfleisch','sauerbraten','kassler','eisbein','haxe','leberkäse','weißwurst','grillwurst','salsiccia','schnitzel','cordon bleu','geflügel','innereien','ochsenschwanz','tartar','carpaccio','pangasius','tilapia','lachsfilet','forelle','steak'],
4:['mineralwasser','sprudelwasser','stilles wasser','apfelschorle','orangensaft','multivitamin','traubensaft','tomatensaft','nektar','limonade','brause','eistee','ice tea','energy','red bull','monster','club mate','=mate','tonic','ginger ale','bitter lemon','malzbier','radler','=pils','weizen','helles','kölsch','=alt','lager','=ale','=bock','whisky','whiskey','wodka','vodka','=gin','=rum','tequila','likör','schnaps','=korn','cognac','weinbrand','brandy','aperol','campari','wermut','rotwein','weißwein','weisswein','roséwein','riesling','burgunder','chardonnay','merlot','glühwein','cidre','secco','champagner','espresso','kaffeebohnen','kaffeepads','kapseln','cappuccino','latte','früchtetee','kräutertee','grüntee','schwarztee','=tee','matcha','smoothie','kombucha','sirup','direktsaft','kokoswasser','proteinshake','pepsi','coca','sekt','prosecco','schorle','getränk','fruchtsaft','gemüsesaft','bier','wein','kaffee','cola','bitter'],
5:[]};
Object.entries(MORE).forEach(([c,w])=>KW[c].push(...w));
const PRE=[['wassermelone',0],['weintraube',0],['traube',0],['teewurst',3],['bierschinken',3],['hefeweizen',4],['kaffeesahne',2],['kaffeemilch',2],['haferdrink',2],['sojadrink',2],['mandeldrink',2],['reisdrink',2],['buttermilch',2],['butterbrot',1],['butterbrezel',1],['butterkuchen',1],['buttercroissant',1],['hörnchen',1],['butterkeks',5],['erdnuss',5],['kokosmilch',5],['kokosöl',5],['olivenöl',5],['=öl',5],['apfelmus',5],['tomatenmark',5],['dosen',5],['=dose',5],['passierte',5],['ketchup',5],['senf',5],['mayo',5],['nudel',5],['pasta',5],['spaghetti',5],['penne',5],['fusilli',5],['makkaroni',5],['lasagne',5],['gnocchi',5],['spätzle',5],['=reis',5],['basmati',5],['risotto',5],['couscous',5],['bulgur',5],['quinoa',5],['linsen',5],['kichererbse',5],['kidney',5],['aufstrich',5],['pulver',5],['gewürz',5],['haferflocken',5],['müsli',5],['cornflakes',5],['schokolade',5],['schoko',5],['kakao',5],['nutella',5],['marmelade',5],['konfitüre',5],['honig',5],['zucker',5],['=salz',5],['pfeffer',5],['essig',5],['soße',5],['sosse',5],['sauce',5],['brühe',5],['suppe',5],['konserve',5],['glas',5],['chips',5],['pommes',5],['cracker',5],['salzstangen',5],['popcorn',5],['nuss',5],['nüsse',5],['mandeln',5],['rosinen',5],['keks',5],['plätzchen',5],['gummibär',5],['bonbon',5],['kaugummi',5],['=eis',5],['speiseeis',5],['eiscreme',5],['pizza',5],['tiefkühl',5],['pesto',5],['oliven',5],['kapern',5],['sardinen',5],['margarine',2]];
let manual=false;
function guess(txt){
  const toks=txt.toLowerCase().split(/[^a-zäöüß]+/).filter(Boolean);
  const hit=(t,k)=>k[0]==='='?t===k.slice(1):(k.length<=3?t===k:t.includes(k));
  for(const [k,c] of PRE) for(const t of toks) if(hit(t,k)) return c;
  for(const c of [4,3,2,1,0]) for(const t of toks) for(const k of KW[c]) if(hit(t,k)) return c;
  return toks.length?5:null;
}
function auto(){
  if(manual)return;
  const g=guess($("name").value);
  if(g!==null){$("cat").value=g;$("cat").classList.add("auto")}else{$("cat").classList.remove("auto")}
}
function add(){
  const n=$("name").value.trim(); if(!n){$("name").focus();return}
  items.push({id:Date.now()+Math.random(),name:n,qty:$("qty").value.trim()||"1",cat:+$("cat").value,done:false});
  $("name").value="";$("qty").value="1";manual=false;$("cat").value=5;$("cat").classList.remove("auto");$("name").focus();save();render();
}
function render(){
  const box=$("list"); box.innerHTML="";
  CATS.forEach((c,ci)=>{
    const g=items.filter(i=>i.cat===ci); if(!g.length)return;
    const sec=document.createElement("section"); sec.className="group";
    const open=g.filter(i=>!i.done).length;
    sec.innerHTML=`<h2><span class="ico">${c[0]}</span>${c[1].replace("&","&amp;")}<small>${open} offen</small></h2>`;
    const ul=document.createElement("ul");
    g.sort((a,b)=>a.done-b.done).forEach(it=>{
      const li=document.createElement("li"); if(it.done)li.className="done";
      const b=document.createElement("button"); b.className="chk"; b.setAttribute("aria-label",it.name+" abhaken");
      b.innerHTML='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>';
      b.onclick=()=>{it.done=!it.done;save();render()};
      const s=document.createElement("span"); s.className="name"; s.textContent=it.name;
      const q=document.createElement("span"); q.className="q"; q.textContent=it.qty+"×".replace("×",/^\d+$/.test(it.qty)?"×":"");
      const d=document.createElement("button"); d.className="del"; d.textContent="×"; d.setAttribute("aria-label",it.name+" löschen");
      d.onclick=()=>{items=items.filter(x=>x!==it);save();render()};
      li.append(b,s);
      if(it.qty!=="1")li.append(q);
      li.append(d); ul.append(li);
    });
    sec.append(ul); box.append(sec);
  });
  const total=items.length, done=items.filter(i=>i.done).length, p=total?Math.round(done/total*100):0;
  $("empty").hidden=total>0; $("clear").hidden=done===0;
  $("arc").style.strokeDashoffset=213.6*(1-p/100); $("pct").textContent=p+"%";
  $("title").textContent= total&&done===total ? "Alles im Korb!" : "Heute auf dem Zettel";
  $("sub").textContent= !total ? "Noch nichts im Korb." : done===total ? "Alles besorgt. Guten Appetit!" : `${total-done} von ${total} Artikeln fehlen noch.`;
}
$("addBtn").onclick=add;
$("name").addEventListener("input",auto);
$("cat").addEventListener("change",()=>{manual=true;$("cat").classList.remove("auto")});
$("cat").value=5;
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
$("clear").onclick=()=>{items=items.filter(i=>!i.done);save();render()};
$("theme").onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme=dark?"light":"dark";
};
render();
</script>
</body>
</html>
